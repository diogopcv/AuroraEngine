<svg xmlns="http://www.w3.org/2000/svg" width="880" height="836" viewBox="0 0 880 836" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>Aurora Engine architecture</title>
<desc>Six layers, from tools down to core. Each layer is a static library that depends only on the layers below it. Core calls the operating system for virtual memory only; tests sit outside the stack.</desc>

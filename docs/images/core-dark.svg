<rect x="36.0" y="360" width="643.6" height="54" rx="6" fill="#04342C" stroke="#5DCAA5" stroke-width="1"/>
<text x="357.8" y="379.0" font-size="13" font-weight="600" fill="#E1F5EE" text-anchor="middle" dominant-baseline="central">VirtualBuffer</text>
<text x="357.8" y="397.0" font-size="12" font-weight="400" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">reserve once, commit in place, the base address never moves</text>

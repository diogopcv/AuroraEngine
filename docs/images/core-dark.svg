<svg xmlns="http://www.w3.org/2000/svg" width="880" height="698" viewBox="0 0 880 698" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>Aurora core layer</title>

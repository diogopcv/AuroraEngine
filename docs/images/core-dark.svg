<text x="20" y="668" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" dominant-baseline="central">Arrows mean “built on”. Arena, Pool, HandlePool and DenseArray grow inside one reservation, so pointers never move.</text>

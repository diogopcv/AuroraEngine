<svg xmlns="http://www.w3.org/2000/svg" width="880" height="486" viewBox="0 0 880 486" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>Aurora runtime threads</title>
<desc>The main thread runs the frame and talks to the render, IO, audio and worker threads only through frame packets and queues.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="20" y="20" width="840" height="140" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="36" y="42" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" dominant-baseline="central">Main thread</text>
<text x="36" y="60" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">Window, input, simulation, world, extract</text>
<rect x="36.0" y="82" width="187.0" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="129.5" y="102.0" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Frame start</text>
<text x="129.5" y="120.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">apply cvars, drain queues</text>
<rect x="243.0" y="82" width="187.0" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="336.5" y="102.0" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Platform and input</text>
<text x="336.5" y="120.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">window messages</text>
<path d="M225.0 110 L241.0 110" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="450.0" y="82" width="187.0" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="543.5" y="102.0" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Fixed-step update</text>
<text x="543.5" y="120.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">systems, 0..N times</text>
<path d="M432.0 110 L448.0 110" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="657.0" y="82" width="187.0" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="750.5" y="102.0" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Extract</text>
<text x="750.5" y="120.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">writes the frame packet</text>
<path d="M639.0 110 L655.0 110" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="36.0" y="236" width="187.0" height="72" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="129.5" y="256.0" font-size="13" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">IO thread</text>
<text x="129.5" y="274.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">blocking file reads</text>
<text x="129.5" y="290.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">watches cooked assets</text>
<rect x="243.0" y="236" width="187.0" height="72" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="336.5" y="256.0" font-size="13" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">Audio thread</text>
<text x="336.5" y="274.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">real-time mixing</text>
<text x="336.5" y="290.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">no locks, no allocation</text>
<rect x="450.0" y="236" width="187.0" height="72" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="543.5" y="256.0" font-size="13" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">Workers</text>
<text x="543.5" y="274.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">jobs over array ranges</text>
<text x="543.5" y="290.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">hardware threads − 2</text>
<rect x="657.0" y="236" width="187.0" height="72" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="750.5" y="256.0" font-size="13" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">Render thread</text>
<text x="750.5" y="274.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">applies packet commands</text>
<text x="750.5" y="290.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">records and presents</text>
<path d="M129.5 160 L129.5 233" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="139.5" y="189" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">SPSC requests</text>
<text x="139.5" y="205" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">and completions</text>
<path d="M336.5 160 L336.5 233" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="346.5" y="189" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">SPSC commands</text>
<text x="346.5" y="205" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">and events</text>
<path d="M543.5 160 L543.5 233" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="553.5" y="189" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">scheduler</text>
<text x="553.5" y="205" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">phases</text>
<path d="M750.5 138 L750.5 233" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="760.5" y="189" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">frame packets</text>
<text x="760.5" y="205" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">ring of 2</text>
<path d="M750.5 308 L750.5 341" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="657.0" y="344" width="187.0" height="56" rx="6" fill="none" stroke="#8c959f" stroke-width="1" stroke-dasharray="5 4"/>
<text x="750.5" y="364.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">GPU</text>
<text x="750.5" y="382.0" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">two frames in flight</text>
<text x="20" y="448" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">Threads never share mutable state: data is copied into packets and queue entries,</text>
<text x="20" y="466" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">or handed over with explicit ownership.</text>
</svg>

<text x="768.8000000000001" y="379.0" font-size="13" font-weight="600" fill="#E1F5EE" text-anchor="middle" dominant-baseline="central">mimalloc</text>
<text x="768.8000000000001" y="397.0" font-size="12" font-weight="400" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">general-purpose heap</text>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" viewBox="0 0 880 236" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>Aurora frame pipeline</title>
<desc>While the main thread simulates frame k+1, the render thread records frame k and the GPU executes frame k-1.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20" y="46" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" dominant-baseline="central">Main</text>
<rect x="140.0" y="24" width="160" height="44" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="220.0" y="46.0" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">simulate + extract 3</text>
<rect x="310.0" y="24" width="160" height="44" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="390.0" y="46.0" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">simulate + extract 4</text>
<rect x="480.0" y="24" width="160" height="44" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="560.0" y="46.0" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">simulate + extract 5</text>
<rect x="650.0" y="24" width="160" height="44" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="730.0" y="46.0" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">simulate + extract 6</text>
<text x="20" y="104" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" dominant-baseline="central">Render</text>
<rect x="225.0" y="82" width="160" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="305.0" y="104.0" font-size="13" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">record 2</text>
<rect x="395.0" y="82" width="160" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="475.0" y="104.0" font-size="13" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">record 3</text>
<rect x="565.0" y="82" width="160" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="645.0" y="104.0" font-size="13" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">record 4</text>
<text x="20" y="162" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" dominant-baseline="central">GPU</text>
<rect x="310.0" y="140" width="160" height="44" rx="6" fill="none" stroke="#8c959f" stroke-width="1" stroke-dasharray="5 4"/>
<text x="390.0" y="162.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">execute 1</text>
<rect x="480.0" y="140" width="160" height="44" rx="6" fill="none" stroke="#8c959f" stroke-width="1" stroke-dasharray="5 4"/>
<text x="560.0" y="162.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">execute 2</text>
<rect x="650.0" y="140" width="160" height="44" rx="6" fill="none" stroke="#8c959f" stroke-width="1" stroke-dasharray="5 4"/>
<text x="730.0" y="162.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">execute 3</text>
<path d="M140 206 L856 206" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="140" y="222" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">time</text>
</svg>

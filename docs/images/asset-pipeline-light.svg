<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>Aurora asset pipeline</title>
<desc>Offline, the cooker turns source files into GPU-ready cooked files. At runtime the IO thread reads them, the asset server finalizes them and the render server uploads them.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="20" y="20" width="840" height="140" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="36" y="42" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" dominant-baseline="central">Offline</text>
<text x="36" y="60" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">The cooker converts sources; the runtime never parses them</text>
<rect x="36.0" y="76" width="209.33333333333334" height="66" rx="6" fill="none" stroke="#8c959f" stroke-width="1" stroke-dasharray="5 4"/>
<text x="140.66666666666669" y="101.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">Source assets</text>
<text x="140.66666666666669" y="119.0" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">glTF, PNG, HLSL</text>
<rect x="335.33333333333337" y="76" width="209.33333333333334" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="440.00000000000006" y="93.0" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Asset cooker</text>
<text x="440.00000000000006" y="111.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">mips, BC compression, DXC</text>
<text x="440.00000000000006" y="127.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">incremental by hash</text>
<rect x="634.6666666666667" y="76" width="209.33333333333334" height="66" rx="6" fill="none" stroke="#8c959f" stroke-width="1" stroke-dasharray="5 4"/>
<text x="739.3333333333334" y="93.0" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">Cooked files</text>
<text x="739.3333333333334" y="111.0" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">GPU-ready, loaded in place</text>
<text x="739.3333333333334" y="127.0" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">offsets, not pointers</text>
<path d="M248.33333333333334 109.0 L332.33333333333337 109.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M547.6666666666667 109.0 L631.6666666666667 109.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="335.33333333333337" y="184" width="209.33333333333334" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="440.00000000000006" y="201.0" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Asset formats</text>
<text x="440.00000000000006" y="219.0" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">shared layouts, no logic</text>
<path d="M440.00000000000006 182 L440.00000000000006 145" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="20" y="258" width="840" height="140" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="36" y="280" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" dominant-baseline="central">Runtime</text>
<text x="36" y="298" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">Loading never stalls the frame</text>
<rect x="634.6666666666667" y="314" width="209.33333333333334" height="66" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="739.3333333333334" y="331.0" font-size="13" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">IO thread</text>
<text x="739.3333333333334" y="349.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">blocking reads</text>
<text x="739.3333333333334" y="365.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">folder watch for hot reload</text>
<rect x="335.33333333333337" y="314" width="209.33333333333334" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="440.00000000000006" y="331.0" font-size="13" font-weight="600" fill="#3C3489" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" dominant-baseline="central">assets</text>
<text x="440.00000000000006" y="349.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">RefPool, loader registry</text>
<text x="440.00000000000006" y="365.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">finalized at frame start</text>
<rect x="36.0" y="314" width="209.33333333333334" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="140.66666666666669" y="331.0" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Render server</text>
<text x="140.66666666666669" y="349.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">mesh and texture loaders</text>
<text x="140.66666666666669" y="365.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">create GPU resources</text>
<path d="M440.00000000000006 234 L440.00000000000006 311" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M739.3333333333334 142 L739.3333333333334 311" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M631.6666666666667 347.0 L547.6666666666667 347.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M332.33333333333337 347.0 L248.33333333333334 347.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="749.3333333333334" y="246" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">read</text>
<text x="589.6666666666667" y="335.0" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">completions</text>
<text x="290.33333333333337" y="335.0" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">calls loader</text>
<text x="20" y="428" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">The cooker and the runtime share only the asset formats module, so the cooker never links runtime code.</text>
<text x="20" y="446" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">Assets are the only reference-counted objects; the render thread sees GPU handles, never asset objects.</text>
</svg>
